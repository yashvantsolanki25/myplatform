name: Auto Tag & Release

on:
  push:
    branches:
      - main  # Change to 'master' if that is your default branch

permissions:
  contents: write  # Grants permission to create tags and releases

jobs:
  tag-version:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the full repository history
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Bump version and create Git tag
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch  # Default bump if no keyword is found

      # Step 3: Create GitHub Release with changelog
      - name: Create a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}