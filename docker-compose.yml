services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: myplatform
      MYSQL_USER: myplatform
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-app-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYPLATFORM_MYSQL_DSN: "myplatform:${MYSQL_PASSWORD:-local-app-password}@tcp(mysql:3306)/myplatform?parseTime=true&charset=utf8mb4"
      MYPLATFORM_DATA_DIR: /data
      MYPLATFORM_ENCRYPTION_KEY: ${MYPLATFORM_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:${MYPLATFORM_PORT:-8080}:8080"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql-data:
  app-data:
